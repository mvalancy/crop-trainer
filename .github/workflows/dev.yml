name: Verify development workspace

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crop-trainer-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run preflight
      - run: npm run build:pages -- "$RUNNER_TEMP/dev-site"
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm run test:pages -- "$RUNNER_TEMP/dev-site"
