name: Test and deploy Crop Trainer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [Verify development workspace]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: crop-trainer-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Test CPU and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run preflight
      - run: npm run build:pages -- "$RUNNER_TEMP/crop-trainer-pages"
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm run test:pages -- "$RUNNER_TEMP/crop-trainer-pages"
      - name: Find verified dev revision
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=dev&status=success&event=push&per_page=50" --jq '[.workflow_runs[] | select(.name=="Verify development workspace")][0].head_sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the verified preview separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.preview.outputs.sha }}
          path: preview-source
          persist-credentials: false
      - name: Stage the development workspace at /next/
        working-directory: preview-source
        run: node ci/build-pages.mjs "$RUNNER_TEMP/crop-trainer-pages/next"
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/crop-trainer-pages
          include-hidden-files: true

  deploy:
    name: Deploy verified site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
