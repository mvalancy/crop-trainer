<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 306" width="384" height="306" role="img" aria-labelledby="title desc">
  <title id="title">A tomato and a soil bump make similar height peaks</title>
  <desc id="desc">Two measured patches from synthetic field 1370561. The smoothed peaks differ by less than a millimetre. Relative to the low surface in the surrounding ring, the tallest central return rises 7.7 centimetres near plant 8 and 2.4 centimetres at the soil bump. The ring spreads are 1.1 and 1.0 centimetres. Each square in the center or ring is a 5 cm cell with a measured return.</desc>
  <style>
    text {font-family:system-ui,sans-serif;fill:#ecf4e8}
    .title {font-size:21px;font-weight:700}
    .label {font-size:15px;font-weight:650}
    .value {font-size:19px;font-weight:700;fill:#ffdf8b}
    .small {font-size:13px;fill:#c5dad1}
    .ring {fill:none;stroke:#6cc7b0;stroke-width:1;stroke-dasharray:3 3}
    @media (prefers-reduced-motion: no-preference) {
      .sample {animation:read-ring 1s ease-out .12s backwards}
      .measure {animation:appear .68s ease-out .95s backwards}
      @keyframes read-ring {from {opacity:.15} to {opacity:1}}
      @keyframes appear {from {transform:translateY(4px)} to {transform:translateY(0)}}
    }
  </style>
  <rect width="384" height="306" rx="12" fill="#17392f"/>
  <text class="title" x="18" y="31">Two peaks, both about 5 cm</text>
  <path stroke="#3c6054" d="M18 45H366M192 54V249M18 258H366"/>
