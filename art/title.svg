<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
<title id="title">Crop Trainer</title><desc id="desc">A mint LiDAR beam sweeps across rows of pixel-art lettuce. Bright returns blink over the plants.</desc>
<defs>
 <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#426956" stroke-width=".8"/></pattern>
 <g id="plant" shape-rendering="crispEdges"><path fill="#164833" d="M-18 0h36v7h-36z"/><path fill="#6fb849" d="M-19-14h6v-6h9v-7H6v5h9v6h5v11h-5v6H-9v-4h-10z"/><path fill="#aede60" d="M-12-14h6v-7h7v6H-4v8h-8zm17 4h9v5H5z"/><path fill="#41945b" d="M-4-12h7v4h4v7H-4z"/></g>
 <linearGradient id="beam"><stop stop-color="#bfef76" stop-opacity="0"/><stop offset="1" stop-color="#bfef76" stop-opacity=".35"/></linearGradient>
 <clipPath id="field"><rect x="539" y="14" width="480" height="252" rx="16"/></clipPath>
</defs>
<style>
.beam{animation:scan 4.8s ease-in-out infinite alternate}.return{animation:pulse 2.4s ease-in-out infinite alternate}.r2{animation-delay:-1.2s}
@keyframes scan{from{transform:translateX(-170px)}to{transform:translateX(220px)}}@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.beam,.return{animation:none}}
</style>
<rect width="1040" height="280" rx="20" fill="#153b2b"/>
<g clip-path="url(#field)"><rect x="530" width="510" height="280" fill="url(#grid)"/>
<g transform="translate(555 17) skewY(-10)">
<path fill="#31553a" d="M0 80h490v35H0zm0 80h490v35H0zm0 80h490v35H0z"/>
<g id="row"><use href="#plant" x="32" y="95"/><use href="#plant" x="104" y="95"/><use href="#plant" x="176" y="95"/><use href="#plant" x="248" y="95"/><use href="#plant" x="320" y="95"/><use href="#plant" x="392" y="95"/><use href="#plant" x="464" y="95"/></g>
<use href="#row" transform="translate(22 80)"/><use href="#row" transform="translate(-6 160)"/></g>
<g class="beam"><path fill="url(#beam)" d="m711 0 60 0 90 280h-60z"/><path stroke="#d8ff96" stroke-width="3" d="m771 0 90 280"/></g>
<g fill="#ff8862"><circle class="return" cx="660" cy="79" r="5"/><circle class="return r2" cx="825" cy="129" r="5"/><circle class="return" cx="720" cy="220" r="5"/></g></g>
<text x="44" y="66" fill="#c4e98f" font-family="monospace" font-size="17" letter-spacing="3">THE PROCEDURAL FARM</text>
<text x="40" y="154" fill="#fff8e8" font-family="system-ui,sans-serif" font-size="76" font-weight="750" letter-spacing="-4">Crop Trainer</text>
<text x="46" y="211" fill="#c5dbc4" font-family="monospace" font-size="19">LETTUCE  /  LiDAR  /  LOCAL ML</text>
</svg>
