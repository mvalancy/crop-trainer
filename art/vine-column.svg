<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 208" role="img" aria-labelledby="title desc">
  <title id="title">What might be standing in this square?</title>
  <desc id="desc">A side-view sketch shows dots stacked near a vine stem. Height bands light up from the ground upward. The square is a candidate to check against the surveyed base.</desc>
  <style>
    text {font: 600 16px system-ui,sans-serif; fill:#27493c}
    .title {font:bold 23px Georgia,serif}
    @media (prefers-reduced-motion: no-preference) {
      .band {animation: read 5s infinite}
      .middle {animation-delay:.55s} .upper {animation-delay:1.1s}
      @keyframes read {0%,85%,100% {fill:#e9e5c6} 30%,60% {fill:#f3c878}}
    }
  </style>
  <rect x="1" y="1" width="558" height="206" rx="16" fill="#faf4df" stroke="#cec8a7"/>
  <text class="title" x="280" y="31" text-anchor="middle">What might be standing in this square?</text>
  <g fill="none" stroke-linecap="round">
    <path d="M32 157q63 -7 130 0t68 0" stroke="#a68352" stroke-width="3"/>
    <path d="M115 157q-1 -24 6 -47t-1 -34m1 25Q89 90 66 93m53 -2q30 -13 61 -10" stroke="#876344" stroke-width="8"/>
    <path d="M79 93l3 -23m57 17 1 -30m22 25 8 -21" stroke="#53724b" stroke-width="3"/>
    <path d="M81 81q-21 -4 -16 -19 19 0 16 19m59 -10q-15 -4 -15 -17 17 -1 15 17m27 -2q3 -19 19 -19 0 14 -19 19" fill="#87ad72" stroke="#53724b"/>
    <path d="M237 104q15 -7 34 0m-6 -6 7 6 -8 5" stroke="#9e895e" stroke-width="2"/>
  </g>
  <g stroke="#c9c5a4" fill="#e9e5c6">
    <rect class="band" x="306" y="122" width="91" height="31" rx="3"/>
    <rect class="band middle" x="306" y="89" width="91" height="31" rx="3"/>
    <rect class="band upper" x="306" y="56" width="91" height="31" rx="3"/>
  </g>
  <path d="M342 143h.1m4-12h.1m-1 -18h.1m6 -9h.1m1 -20h.1m2 -17h.1" stroke="#477968" stroke-width="7" stroke-linecap="round"/>
  <text x="409" y="77">Upper band</text><text x="409" y="110">Middle band</text><text x="409" y="143">Lower band</text>
  <text x="119" y="187" text-anchor="middle">Follow the stem</text><text x="381" y="187" text-anchor="middle">Look for a stack of returns</text>
</svg>
