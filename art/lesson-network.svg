<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 195" role="img" aria-labelledby="title desc">
  <title id="title">Inside the starter network</title>
  <desc id="desc">Thirteen inputs feed four hidden units. Each hidden unit contributes to the single output.</desc>
