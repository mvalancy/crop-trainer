<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 196" role="img" aria-labelledby="title desc">
  <title id="title">A grower’s field notebook</title>
  <desc id="desc">A dotted survey path crosses rows of plants on the left page. A magnified rosette on the facing page has a center pin and a ruler.</desc>
  <defs>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M15 0H0V15" fill="none" stroke="#d1d4b6"/></pattern>
    <g id="row" fill="#608954" stroke="#44764b" stroke-width="1.5">
      <circle r="6"/><circle cx="29" r="6"/><circle cx="58" r="6"/><circle cx="87" r="6"/><circle cx="116" r="6"/>
    </g>
    <g id="blade"><path d="M0 4Q-19-3-18-25Q-15-42-4-37Q12-29 0 4Z" fill="#8fbb72" stroke="#416e49" stroke-width="1.8"/><path d="M0 0Q-5-13-9-25" fill="none" stroke="#588651" stroke-width="1.5"/></g>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .trail { animation: walk 3s linear infinite }
      @keyframes walk { to {stroke-dashoffset:-32} }
    }
  </style>
  <rect width="600" height="196" rx="16" fill="#193e31"/>
  <path d="M54 30Q155 11 286 35Q363 11 493 26V164Q374 151 286 176Q163 153 54 170Z" fill="#bba681"/>
  <path d="M57 23Q179 8 286 32V167Q180 143 57 160Z" fill="#faf3d9"/>
  <path d="M286 32Q388 8 491 23V160Q380 147 286 167Z" fill="#f1e8c7"/>
  <path d="M286 34V165" stroke="#cfbd94" stroke-width="3"/>
  <g transform="translate(75 46) rotate(-3)">
    <rect width="178" height="96" rx="6" fill="#e8e8c8"/><rect width="178" height="96" rx="6" fill="url(#grid)"/>
    <g stroke="#c6ccaa" stroke-width="14" stroke-linecap="round"><path d="M22 20h124m-124 27h124m-124 27h124"/></g>
    <use href="#row" x="25" y="20"/><use href="#row" x="25" y="47"/><use href="#row" x="25" y="74"/>
    <path class="trail" d="M10 86H149Q161 86 161 73V61Q161 60 149 60H86V48" fill="none" stroke="#a74a37" stroke-width="2.8" stroke-dasharray="4 4"/>
    <circle cx="83" cy="47" r="10" fill="none" stroke="#a74a37" stroke-width="2.4"/>
  </g>
  <g transform="translate(377 86)">
    <circle r="48" fill="#fff8df" stroke="#cabf9a" stroke-width="1.5"/>
    <use href="#blade"/><use href="#blade" transform="rotate(70)"/><use href="#blade" transform="rotate(145)"/><use href="#blade" transform="rotate(218)"/><use href="#blade" transform="rotate(288)"/>
    <circle r="5" fill="#ad4835" stroke="#fff8df" stroke-width="2"/>
  </g>
  <path d="M344 145l72-5m-72 0v6m14-6v4m14-5v4m15-5v4m15-5v4m14-8v7" stroke="#88784e" stroke-width="2"/>
  <g transform="translate(541 28) rotate(12)"><rect x="-7" width="14" height="114" rx="3" fill="#eab164"/><path d="M0 3v106" stroke="#c28748" stroke-width="3"/><path d="M-7 114H7L0 135Z" fill="#ecce98"/><path d="M-2 129h4l-2 6Z" fill="#283d31"/><rect x="-7" width="14" height="12" rx="2" fill="#d77b65"/></g>
</svg>
