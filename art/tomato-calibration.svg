<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 315" width="416" height="315" role="img" aria-labelledby="title desc">
  <title id="title">Three sets of fields for one tomato detector</title>
  <desc id="desc">Six training plantings teach the weights. Four other plantings let us choose a score cutoff for the saved model. Six reserved plantings measure final matches, extra pins and misses. The small maps illustrate the steps.</desc>
  <defs>
    <g id="seedling">
      <path d="M0 3V0" fill="none" stroke="#36543b" stroke-width="1.5"/>
      <path d="M0 1C-5 1-7-2-7-5C-3-5 0-3 0 1Z" fill="#608251"/>
      <path d="M0 1C0-3 3-5 7-5C7-1 4 1 0 1Z" fill="#436d4a"/>
    </g>
    <g id="match">
      <circle r="6" fill="none" stroke="#605174" stroke-width="1.9"/>
      <circle cx="1.5" cy="-1" r="2.8" fill="#116a50"/>
    </g>
    <clipPath id="field-edge"><rect x="14" y="20" width="105" height="68" rx="8"/></clipPath>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #233e30 }
    .heading { font-size: 19px; font-weight: 700 }
    .number { font-size: 15px; font-weight: 630; fill: #44634b }
    .note { font-size: 15px }
    .bed { fill: #eee9d8; stroke: #dcd6bf }
    .furrow { fill: none; stroke: #d3c8a8; stroke-width: 2 }
    .sweep { opacity: 0 }
    @media (prefers-reduced-motion: no-preference) {
      .sweep { animation: scan 3s ease-out 1 both }
      .gate { animation: choose 3s ease-in-out 1 both }
      .hits { animation: inspect 3s ease-out 1 both }
      @keyframes scan { 0%,3% { transform: translateX(-22px); opacity: 0 } 8% { opacity: .8 } 40%,100% { transform: translateX(90px); opacity: 0 } }
      @keyframes choose { 0%,36% { transform: translateX(-18px) } 53% { transform: translateX(8px) } 72%,100% { transform: translateX(0) } }
      @keyframes inspect { 0%,65% { opacity: .3 } 100% { opacity: 1 } }
    }
  </style>
  <rect width="416" height="315" rx="15" fill="#f7f8ef"/>
  <path d="M15 105H401M15 210H401" stroke="#d4ddcf"/>

  <rect x="14" y="20" width="105" height="68" rx="8" class="bed"/>
  <g class="furrow"><path d="M23 41H110M23 67H110"/></g>
  <g>
    <use href="#seedling" x="33" y="39"/><use href="#seedling" x="53" y="40"/><use href="#seedling" x="78" y="38"/><use href="#seedling" x="99" y="40"/>
    <use href="#seedling" x="30" y="65"/><use href="#seedling" x="56" y="64"/><use href="#seedling" x="80" y="66"/><use href="#seedling" x="103" y="65"/>
  </g>
  <g clip-path="url(#field-edge)"><path class="sweep" d="M32 20V88" stroke="#a97e24" stroke-width="3"/></g>
  <text x="137" y="39" class="heading">Train the detector</text>
  <text x="137" y="62" class="number">6 plantings per fit</text>
  <text x="137" y="82" class="note">Learn weights from labeled peaks.</text>

  <rect x="14" y="126" width="105" height="68" rx="8" fill="#e7eee2" stroke="#cedac7"/>
  <path d="M25 174H108" stroke="#728670"/>
  <g fill="#729482">
    <circle cx="27" cy="168" r="2.5"/><circle cx="35" cy="157" r="2.5"/><circle cx="44" cy="168" r="2.5"/>
    <circle cx="56" cy="162" r="2.5"/><circle cx="60" cy="152" r="2.5"/><circle cx="69" cy="167" r="2.5"/>
    <circle cx="85" cy="158" r="2.5"/><circle cx="90" cy="168" r="2.5"/><circle cx="101" cy="164" r="2.5"/>
  </g>
  <g class="gate">
    <path d="M78 143V177" stroke="#994223" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="m74 138 4 6 4-6Z" fill="#994223"/>
  </g>
  <text x="137" y="144" class="heading">Choose the cutoff</text>
  <text x="137" y="167" class="number">4 other plantings</text>
  <text x="137" y="187" class="note">Try 19 cutoffs on the same scores.</text>

  <rect x="14" y="231" width="105" height="68" rx="8" class="bed"/>
  <g class="furrow"><path d="M23 252H110M23 278H110"/></g>
  <g class="hits">
    <use href="#match" x="32" y="252"/><use href="#match" x="65" y="251"/><use href="#match" x="96" y="253"/>
    <use href="#match" x="34" y="277"/><use href="#match" x="95" y="279"/>
    <path d="M61 274l8 8m0-8-8 8" fill="none" stroke="#605174" stroke-width="2"/>
    <path d="M77 259h6v6h-6Z" fill="#a04628"/>
  </g>
  <text x="137" y="249" class="heading">Test the frozen choice</text>
  <text x="137" y="272" class="number">6 reserved plantings</text>
  <text x="137" y="292" class="note">Count matches, extras and misses.</text>
</svg>
