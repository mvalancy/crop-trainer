    text{font-family:system-ui,sans-serif;fill:#203e34;text-anchor:middle}
    .layout{font-size:20px;font-weight:650}.count{font-size:20px;font-weight:700}.sub{font-size:16px}
    .bound{stroke:#ffdd8d;stroke-width:1.8;stroke-dasharray:5 4;fill:none}
    .halo{fill:none;stroke:#ffb46b;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:identify 3.6s ease-out infinite}
    @keyframes identify{0%,35%{opacity:0;transform:scale(.7)}50%{opacity:.9}85%,100%{opacity:0;transform:scale(1.65)}}
    @media(prefers-reduced-motion:reduce){.halo{animation:none;opacity:.55}}
  </style>
