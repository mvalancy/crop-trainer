<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 354" role="img" aria-labelledby="title desc">
  <title id="title">One seedling sampled on a grid and a ring layout</title>
  <desc id="desc">Actual simulated returns from the same 52 centimetre square around plant six. Both layouts sampled 60,000 rays in the full plot. The grid returned 163 points in the patch and three hit the seedling. The OS1-64-inspired rings returned 123 points here, all from soil. Each dashed box outlines the seedling’s horizontal bounds. Three orange points pulse to identify crop returns.</desc>
