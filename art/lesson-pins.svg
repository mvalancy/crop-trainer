<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 195" role="img" aria-labelledby="title desc">
  <title id="title">Score cutoff and spacing</title>
  <desc id="desc">In this schematic the 0.30 score drops below cutoff. The nearby 0.64 candidate loses to the 0.77 candidate.</desc>
  <style>
    text {font-family:system-ui,sans-serif}
    @media (prefers-reduced-motion: no-preference) {
      .mark {animation: glow 3.5s ease-in-out infinite alternate} @keyframes glow {from {opacity:.48} to {opacity:1}}
    }
  </style>
  <rect width="500" height="195" rx="14" fill="#fff8e2"/>
  <text x="250" y="32" text-anchor="middle" fill="#173e32" font-size="20" font-weight="700">From candidate scores to a final pin</text>
  <rect x="15" y="49" width="146" height="92" rx="8" fill="#dce8bf"/>
  <text x="88" y="171" text-anchor="middle" fill="#173e32" font-size="17" font-weight="700">Score</text>
  <path d="M46 70l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="46" y="94" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.77</text>
  <path d="M70 104l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="70" y="128" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.64</text>
  <path d="M131 82l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="131" y="106" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.30</text>
  <rect x="177" y="49" width="146" height="92" rx="8" fill="#dce8bf"/>
  <text x="250" y="171" text-anchor="middle" fill="#173e32" font-size="17" font-weight="700">Apply cutoff</text>
  <path d="M208 70l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="208" y="94" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.77</text>
  <path d="M232 104l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="232" y="128" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.64</text>
  <rect x="339" y="49" width="146" height="92" rx="8" fill="#dce8bf"/>
  <text x="412" y="171" text-anchor="middle" fill="#173e32" font-size="17" font-weight="700">Apply spacing</text>
  <path d="M370 70l6 6-6 6-6-6Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="370" y="94" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">.77</text>
  <path d="M161 89h15m-5-5 5 5-5 5" fill="none" stroke="#507e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mark"/>
  <path d="M323 89h15m-5-5 5 5-5 5" fill="none" stroke="#507e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mark"/>
</svg>
