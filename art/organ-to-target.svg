<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 152" role="img" aria-labelledby="title desc">
  <title id="title">Where does one plant begin?</title>
  <desc id="desc">Follow a leaf to its stem. Attached organs belong to one plant with one reference center.</desc>
  <style>
    text { font: 600 15px system-ui,sans-serif; fill: #294941 }
    .caption { font: bold 24px Georgia,serif }
    @media (prefers-reduced-motion: no-preference) {
      .step { stroke-dasharray: 54; animation: follow 5s ease-in-out infinite }
      .step-2 { animation-delay: .65s }
      @keyframes follow { 0% {stroke-dashoffset:54} 42%,100% {stroke-dashoffset:0} }
      .notice { animation: trace 5s ease-in-out infinite }
      @keyframes trace { 0%,100% {opacity:.45} 42%,76% {opacity:1} }
    }
  </style>
  <defs>
    <g id="blade">
      <path d="M0 0 Q-13 -6 -11 -17 Q-12 -25 -7 -23 Q-6 -31 0 -28 Q8 -32 8 -23 Q16 -22 11 -14 Q12 -6 0 0Z" fill="#84aa66" stroke="#355f54" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <path d="M0 0Q-1 -13 1 -23 M0 -10l-5 -5 M0 -15l5 -6" fill="none" stroke="#517750" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
    </g>
    <g id="pin">
      <path d="M0 1Q-16 -17 -9 -24Q0 -33 9 -24Q16 -17 0 1Z" fill="#f8bc63" stroke="#875428" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="0" cy="-19" r="3" fill="#fff4d6" />
    </g>
    <g id="rosette">
      <g transform="rotate(0)">
        <use href="#blade" />
      </g>
      <g transform="rotate(51)">
        <use href="#blade" />
      </g>
      <g transform="rotate(102)">
        <use href="#blade" />
      </g>
      <g transform="rotate(153)">
        <use href="#blade" />
      </g>
      <g transform="rotate(204)">
        <use href="#blade" />
      </g>
      <g transform="rotate(255)">
        <use href="#blade" />
      </g>
      <g transform="rotate(306)">
        <use href="#blade" />
      </g>
      <circle cx="0" cy="0" r="5" fill="#d4db89" />
    </g>
  </defs>
  <rect x="1" y="1" width="602" height="150" rx="16" fill="#faf4df" stroke="#d6cfac" />
  <path d="M12 112Q85 102 156 112T302 112T448 112T592 112" fill="none" stroke="#d8d7b6" stroke-dasharray="2 5" />
  <text class="caption" x="302" y="30" text-anchor="middle">Where does one plant begin?</text>
  <g transform="translate(106 83) scale(1)">
    <use href="#blade" />
  </g>
  <text x="106" y="137" text-anchor="middle">Look at a leaf</text>
  <path d="M170 83q16 -6 33 0m-6 -6 7 6 -8 4" fill="none" stroke="#9e936c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" class="step step-1" />
  <g transform="translate(302 83) scale(1)">
    <path d="M0 25Q5 -2 1 -20M2 1l-17 -13M3 -9l14 -11" fill="none" stroke="#6c714b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <g transform="translate(-15 -12) scale(0.55)">
      <use href="#blade" />
    </g>
    <g transform="translate(18 -19) scale(0.43)">
      <use href="#blade" />
    </g>
  </g>
  <text x="302" y="137" text-anchor="middle">Follow its stem</text>
  <path d="M366 83q16 -6 33 0m-6 -6 7 6 -8 4" fill="none" stroke="#9e936c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" class="step step-2" />
  <g transform="translate(498 83) scale(1)">
    <g transform="translate(-33 -12) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g transform="translate(0 -12) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g transform="translate(33 -12) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g transform="translate(-33 16) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g transform="translate(0 16) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g transform="translate(33 16) scale(0.42)">
      <use href="#rosette" />
    </g>
    <g class="notice">
      <g transform="translate(-33 -12) scale(0.44)">
        <use href="#pin" />
      </g>
      <g transform="translate(0 -12) scale(0.44)">
        <use href="#pin" />
      </g>
      <g transform="translate(33 -12) scale(0.44)">
        <use href="#pin" />
      </g>
      <g transform="translate(-33 16) scale(0.44)">
        <use href="#pin" />
      </g>
      <g transform="translate(0 16) scale(0.44)">
        <use href="#pin" />
      </g>
      <g transform="translate(33 16) scale(0.44)">
        <use href="#pin" />
      </g>
    </g>
  </g>
  <text x="498" y="137" text-anchor="middle">Mark each plant</text>
</svg>
