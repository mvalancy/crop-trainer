<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 195" role="img" aria-labelledby="title desc">
  <title id="title">Count matched, extra and missed</title>
  <desc id="desc">Four reference plants and three predictions. Two pins fall within different plant circles.</desc>
  <style>
    text {font-family:system-ui,sans-serif}
    @media (prefers-reduced-motion: no-preference) {
      .mark {animation: glow 3.5s ease-in-out infinite alternate} @keyframes glow {from {opacity:.48} to {opacity:1}}
    }
  </style>
  <rect width="500" height="195" rx="14" fill="#fff8e2"/>
  <text x="250" y="30" text-anchor="middle" fill="#173e32" font-size="21" font-weight="700">How many plants got a good pin?</text>
  <rect x="28" y="52" width="444" height="92" rx="8" fill="#e7ebce"/>
  <circle cx="90" cy="92" r="23" fill="none" stroke="#507e50" stroke-width="2.5" />
  <circle cx="188" cy="100" r="23" fill="none" stroke="#507e50" stroke-width="2.5" />
  <circle cx="307" cy="90" r="23" fill="none" stroke="#507e50" stroke-width="2.5" />
  <circle cx="410" cy="101" r="23" fill="none" stroke="#507e50" stroke-width="2.5" />
  <path d="M97 85l7 7-7 7-7-7Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M242 100l7 7-7 7-7-7Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M404 88l7 7-7 7-7-7Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="90" cy="92" r="3" fill="#507e50" stroke="none" stroke-width="2" />
  <circle cx="188" cy="100" r="3" fill="#507e50" stroke="none" stroke-width="2" />
  <circle cx="307" cy="90" r="3" fill="#507e50" stroke="none" stroke-width="2" />
  <circle cx="410" cy="101" r="3" fill="#507e50" stroke="none" stroke-width="2" />
  <circle cx="55" cy="169" r="9" fill="none" stroke="#507e50" stroke-width="2" />
  <text x="72" y="175" text-anchor="start" fill="#173e32" font-size="16" font-weight="500">Plant tolerance</text>
  <path d="M287 162l7 7-7 7-7-7Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="303" y="175" text-anchor="start" fill="#173e32" font-size="16" font-weight="500">Predicted pin</text>
  <path d="M90 92h7m307 3 6 6" fill="none" stroke="#a54434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mark"/>
</svg>
