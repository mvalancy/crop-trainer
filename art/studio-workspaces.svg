<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Two windows onto one planting</title>
  <desc id="desc">A settings sheet slides over the left side of a phone. Beside it a desktop keeps settings and a field open together. A gold ring marks the same plant as both views stay still.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#f6efd8"/><stop offset="1" stop-color="#dbe8cf"/></linearGradient>
    <radialGradient id="leaf"><stop stop-color="#cde89f"/><stop offset="1" stop-color="#599a63"/></radialGradient>
    <pattern id="soil" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#214639"/><circle cx="2" cy="4" r=".8" fill="#699274"/></pattern>
    <g id="plant" fill="url(#leaf)" stroke="#1d583a" stroke-width=".8">
      <ellipse cx="0" cy="-3" rx="5" ry="8"/><ellipse cx="-3" cy="0" rx="8" ry="4.5" transform="rotate(22)"/>
      <ellipse cx="3" cy="0" rx="8" ry="4.5" transform="rotate(-26)"/><path d="M-4 3Q-1-6 5-3Q6 4-4 3Z"/>
    </g>
    <g id="row"><use href="#plant"/><use href="#plant" x="37" y="-3"/><use href="#plant" x="74" y="-6"/><use href="#plant" x="111" y="-9"/></g>
    <g id="plot"><rect width="158" height="115" fill="url(#soil)"/>
      <g fill="none" stroke="#517963" stroke-width="4"><path d="m0 32 158-13m-158 49 158-13m-158 49 158-13"/></g>
      <g transform="translate(17 28)"><use href="#row"/><use href="#row" x="7" y="36"/><use href="#row" x="1" y="72"/></g>
      <g fill="none" stroke="#f1ce77"><circle cx="98" cy="58" r="13"/><circle class="pulse" cx="98" cy="58" r="17" stroke-dasharray="2 4"/></g>
    </g>
    <g id="rows" stroke="#a8be9f" stroke-width="2" stroke-linecap="round">
      <path d="M9 15h31m-31 19h40m-40 19h34"/><path d="M9 20h21m-21 19h26m-26 19h20" stroke-width="1" opacity=".65"/>
    </g>
    <clipPath id="screen"><rect x="61" y="50" width="139" height="184" rx="11"/></clipPath>
  </defs>
  <style>
    @media(prefers-reduced-motion:no-preference) {
      .sheet {animation:slide 7s ease-in-out infinite;}
      .pulse {animation:locate 4s linear infinite;}
      @keyframes slide {0%,12%,100% {transform:translateX(-85px)} 30%,76% {transform:translateX(0)} 94% {transform:translateX(-85px)}}
      @keyframes locate {to {stroke-dashoffset:-24}}
    }
  </style>
  <rect width="680" height="300" rx="19" fill="url(#paper)"/>
  <g fill="#1a332a" stroke="#78977b" stroke-width="2">
    <rect x="53" y="39" width="155" height="206" rx="20"/>
    <rect x="248" y="47" width="384" height="182" rx="11"/>
    <path d="M418 228h41l4 13h-49zM389 245q0-5 7-5h87q8 0 8 5z"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="61" y="50" width="139" height="184" fill="#234539"/>
    <svg x="61" y="72" width="139" height="139" viewBox="14 0 115 115"><use href="#plot"/></svg>
    <rect x="61" y="50" width="139" height="22" fill="#152e27"/><rect x="69" y="57" width="23" height="8" rx="3" fill="#aaca93"/>
    <g class="sheet"><rect x="61" y="72" width="82" height="162" fill="#234135" stroke="#97af90"/><use href="#rows" x="66" y="84"/></g>
    <path d="M108 227h42" stroke="#c1d1b7" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="256" y="55" width="368" height="166" rx="4" fill="#244436"/>
  <svg x="353" y="69" width="270" height="147" viewBox="0 0 158 115" preserveAspectRatio="xMidYMid slice"><use href="#plot"/></svg>
  <path d="M352 69v149" stroke="#9ab392"/><use href="#rows" x="266" y="77"/>
  <g font-family="system-ui,sans-serif" font-weight="650" font-size="16" fill="#214439" text-anchor="middle"><text x="131" y="272">Slide over</text><text x="438" y="272">Work side by side</text></g>
</svg>
