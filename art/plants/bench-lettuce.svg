<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" role="img" aria-labelledby="title desc">
  <title id="title">Three lettuce forms on the same raised bench</title>
  <desc id="desc">Looseleaf spreads horizontally, butterhead cups its inner leaves, and romaine grows taller. A dashed line marks the bench height beneath their three planting positions.</desc>
  <defs>
    <g id="blade">
      <path d="M0 0 Q-8-7-11-16 Q-16-22-12-25 Q-13-31-7-30 Q-4-37 1-33 Q9-37 11-30 Q16-26 12-19 Q12-9 0 0Z" stroke="#3d6945" stroke-linejoin="round"/>
      <path d="M0-1Q1-13 0-28" fill="none" stroke="#548057" stroke-width="1"/>
    </g>
    <g id="loose" fill="#9ac66d">
      <use href="#blade" transform="rotate(-73) scale(1.2 1.6)"/><use href="#blade" transform="rotate(70) scale(1.1 1.53)"/>
      <use href="#blade" transform="rotate(-54) scale(.92 1.3)"/><use href="#blade" transform="rotate(44) scale(1 1.22)"/>
      <use href="#blade" transform="rotate(-24) scale(.85 1.03)"/><use href="#blade" transform="rotate(16) scale(.78 .85)" fill="#b8d886"/>
    </g>
    <g id="butter" fill="#9cbf62">
      <use href="#blade" transform="rotate(-52) scale(1.2 1.24)"/><use href="#blade" transform="rotate(52) scale(1.25 1.28)"/>
      <path d="M0 0Q-31-11-26-33Q-25-40-15-36Q-5-38 0-30Q7-41 17-37Q28-38 25-24Q22-5 0 0Z" fill="#b2cf78" stroke="#3d6945"/>
      <path d="M-12-29Q3-36 14-27Q16-18 2-12Q-9-18-12-29Z" fill="#cedd99" stroke="#739250"/>
    </g>
    <g id="cos" fill="#86b56b">
      <use href="#blade" transform="rotate(-28) scale(.76 1.96)"/><use href="#blade" transform="rotate(26) scale(.80 1.98)"/>
      <use href="#blade" transform="rotate(-12) scale(.76 2.26)"/><use href="#blade" transform="rotate(8) scale(.77 2.14)" fill="#b4ce81"/>
      <use href="#blade" transform="rotate(-2) scale(.54 1.77)" fill="#cbd996"/>
    </g>
  </defs>
  <style>
    text {font-family:system-ui,sans-serif;fill:#254534}
    @media (prefers-reduced-motion:no-preference) {
      .sweep {animation:pulse 4s ease-in-out infinite}
      @keyframes pulse {0%,18%,85%,100%{opacity:.38} 42%,64%{opacity:1}}
    }
  </style>
  <rect x="1" y="1" width="538" height="220" rx="14" fill="#f8f6e8" stroke="#c9ceb6"/>
  <text x="19" y="29" font-size="18" font-weight="650">Three forms, one bench</text>
  <path d="M26 149L46 126H508L489 149Z" fill="#dce4d3" stroke="#849580" stroke-width="1.5"/>
  <path d="M26 149H489V158H26Z" fill="#becdbd" stroke="#849580"/>
  <path d="M39 158V177M472 158V177" stroke="#869787" stroke-width="4"/>
  <path d="M34 138H496" class="sweep" stroke="#547f7a" stroke-dasharray="4 4" fill="none"/>
  <g transform="translate(103 138)"><use href="#loose"/></g>
  <g transform="translate(270 138)"><use href="#butter"/></g>
  <g transform="translate(420 138)"><use href="#cos"/></g>
  <g fill="#235d56"><circle cx="103" cy="139" r="3"/><circle cx="270" cy="139" r="3"/><circle cx="420" cy="139" r="3"/></g>
  <g text-anchor="middle" font-size="17"><text x="103" y="200">Looseleaf</text><text x="270" y="200">Butterhead</text><text x="420" y="200">Romaine</text></g>
</svg>
