  <circle class="refine" cx="40.2" cy="516.8" r="4" fill="#145c71"/>
  <use href="#base" x="180" y="397"/>
  <rect class="cell" x="228" y="379" width="9" height="9" rx="1"/>
  <text class="note" x="246" y="389">Qualifying cell</text>
