    <rect class="cell" x="113.6" y="206.5" width="10.0" height="10.0" rx="1"/>
    <rect class="cell" x="97.0" y="189.9" width="10.0" height="10.0" rx="1"/>
    <rect class="cell" x="80.4" y="206.5" width="10.0" height="10.0" rx="1"/>
    <rect class="cell" x="63.8" y="189.9" width="10.0" height="10.0" rx="1"/>
    <rect class="cell" x="80.4" y="173.3" width="10.0" height="10.0" rx="1"/>
