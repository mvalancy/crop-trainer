<svg xmlns="http://www.w3.org/2000/svg" width="424" height="660" viewBox="0 0 424 660" role="img" aria-labelledby="title desc">
  <title id="title">Which guesses survive spacing?</title>
  <desc id="desc">At the same synthetic tree base, 20 nearby cells qualify in v3 and one survives spacing. Three qualify in v4 and none survives. A stronger v4 cell is selected 82.2 centimetres away. Its final pin is 79.2 centimetres from the base. Adding the three rejected nearby cells as extra guesses would gain one match and two extra pins.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #243f33 }
    .title { font-size: 24px; font-weight: 700 }
    .section { font-size: 19px; font-weight: 670 }
    .label { font-size: 17px; font-weight: 650 }
    .note { font-size: 15px; fill: #42594d }
    .ring { fill: #f2f3e5; stroke: #577065; stroke-width: 1.5; stroke-dasharray: 3 3 }
    .cell { fill: #a3bb8e; stroke: #49634c }
    .kept { fill: #a94d24; stroke: #733218 }
    .pin { fill: #145c71; stroke: #f9faed; stroke-width: 1 }
    .refine { display: none }
    @media (prefers-reduced-motion: no-preference) {
      .refine { display: inline; animation: refine 3.6s ease 1 both }
      @keyframes refine {
        0% { opacity: 0; transform: translate(0,0) }
        20% { opacity: .85; transform: translate(0,0) }
        75%,100% { opacity: 0; transform: translate(-1.7px,-12.9px) }
      }
    }
  </style>
  <defs>
    <g id="base" fill="none" stroke-linecap="round">
      <path d="M-5 0H5m-5-5V5" stroke="#faf8ec" stroke-width="4"/>
      <path d="M-5 0H5m-5-5V5" stroke="#193829" stroke-width="2"/>
    </g>
  </defs>
  <rect x="1" y="1" width="422" height="658" rx="16" fill="#faf8ec" stroke="#c4d1ba"/>
  <text class="title" x="18" y="36">Which guesses survive spacing?</text>
  <text class="note" x="19" y="60">Synthetic orchard · healthy, leafy central leader</text>
  <path d="M18 74H406" stroke="#c4d1ba"/>
  <text class="section" x="19" y="103">Within 15 cm of the planted base</text>
  <text class="note" x="19" y="127">The cross marks the same trunk in both scans.</text>
  <g aria-label="Version 3"><circle class="ring" cx="110" cy="200" r="49.8"/>
    <rect class="kept" x="130.2" y="189.9" width="10.0" height="10.0" rx="1"/>
