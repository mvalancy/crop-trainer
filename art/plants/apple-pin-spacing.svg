  <text class="section" x="19" y="559">If all three nearby cells became pins</text>
  <circle cx="31" cy="590" r="10" fill="#31724a"/>
  <path d="m26 590 3.5 3.5 6.5-7" fill="none" stroke="white" stroke-width="2"/>
  <text class="label" x="49" y="596">1 new match</text>
  <path d="m222 585 10 10m-10 0 10-10m4 0 10 10m-10 0 10-10" fill="none" stroke="#99441f" stroke-width="2.6"/>
  <text class="label" x="258" y="596">2 extra pins</text>
  <text class="note" x="19" y="640">Field 14151223 · tree 2 · overhead grid</text>
