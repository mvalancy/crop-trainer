  <desc id="description">Side and top views of one synthetic overhead scan. Four of the five height bands contain returns near a dormant tree. The nearest height-only pin is 55.8 centimetres from its planted base. The nearest orchard pin is 10.6 centimetres away, within the 15 centimetre matching circle.</desc>
