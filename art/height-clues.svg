<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 188" width="400" height="188" role="img" aria-labelledby="title desc">
  <title id="title">A lettuce and a weed reach the same height</title>
  <desc id="desc">A broad lettuce rosette and a slender branching weed stand on separate ground patches. The dashed measuring line touches the top of both plants.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#163b38"/><stop offset="1" stop-color="#102825"/></linearGradient>
    <linearGradient id="blade" x2=".6" y2="1"><stop stop-color="#d4f694"/><stop offset=".52" stop-color="#9acb64"/><stop offset="1" stop-color="#579954"/></linearGradient>
    <linearGradient id="outer" x2=".5" y2="1"><stop stop-color="#8ac780"/><stop offset="1" stop-color="#286953"/></linearGradient>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".85" fill="#9eccaa" opacity=".23"/></pattern>
    <path id="lettuceLeaf" d="M0 0C-7-5-16-14-16-23q-4-6 1-9-3-7 3-9 0-5 6-5 3-6 8-2 7-3 9 4 5 2 3 8 5 5 1 10C15-16 7-4 0 0Z"/>
    <path id="rib" d="M0-1Q-1-23 0-43m0 26-7-7m7-1 6-7" fill="none" stroke="#386e46" stroke-width="1.4" stroke-linecap="round"/>
    <path id="weedLeaf" d="M0 0Q-13-4-18-17l5 1-3-6 5 2-1-5 6 5 2-3Q3-12 0 0Z"/>
  </defs>
  <rect width="400" height="188" fill="url(#night)"/><rect width="400" height="188" fill="url(#dots)"/>
  <g fill="none" stroke="#91bdad" opacity=".62"><path d="M22 62h116m124 0h116" stroke-dasharray="2 5"/><path d="M19 63v65m-3-65h6m-5 16h3m-3 16h3m-3 16h3m-4 17h6"/></g>
  <g fill="#122b23" stroke="#62947a"><path d="M23 129q49-10 100 0-45 12-100 0Z"/><path d="M282 129q45-8 94 0-44 10-94 0Z"/></g>
  <g transform="translate(76 128)" stroke="#315f44" stroke-width="1" stroke-linejoin="round">
    <g transform="rotate(-62) scale(.87 .91)"><use href="#lettuceLeaf" fill="url(#outer)"/><use href="#rib"/></g>
    <g transform="rotate(62) scale(.84 .95)"><use href="#lettuceLeaf" fill="url(#outer)"/><use href="#rib"/></g>
    <g transform="rotate(-28) scale(.88 1.22)"><use href="#lettuceLeaf" fill="url(#blade)"/><use href="#rib"/></g>
    <g transform="rotate(25) scale(.8 1.26)"><use href="#lettuceLeaf" fill="url(#blade)"/><use href="#rib"/></g>
    <g transform="rotate(-4) scale(.64 1.33)"><use href="#lettuceLeaf" fill="url(#blade)"/><use href="#rib"/></g>
    <g transform="rotate(-58) scale(.77 .83)"><use href="#lettuceLeaf" fill="url(#blade)"/><use href="#rib"/></g>
    <g transform="rotate(54) scale(.8 .79)"><use href="#lettuceLeaf" fill="url(#blade)"/><use href="#rib"/></g>
  </g>
  <g transform="translate(328 128)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0q-4-23 1-37l-1-27M-1-13l-17-16M0-26l17-16M1-37l-10-15" fill="none" stroke="#9bb679" stroke-width="3"/>
    <g fill="#7bab7b" stroke="#568a6a" stroke-width="1"><use href="#weedLeaf" transform="translate(-12 -24) rotate(-22) scale(.85 .8)"/><use href="#weedLeaf" transform="translate(12 -36) scale(-.83 .8)"/><use href="#weedLeaf" transform="translate(-4 -43) rotate(-12) scale(.68 .62)"/><use href="#weedLeaf" transform="translate(0 -55) rotate(22) scale(.32 .46)"/><use href="#weedLeaf" transform="translate(-2 -7) scale(-.7 .54) rotate(-25)"/></g>
  </g>
