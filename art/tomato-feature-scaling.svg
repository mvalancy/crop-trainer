<svg xmlns="http://www.w3.org/2000/svg" width="414" height="286" viewBox="0 0 414 286" role="img" aria-labelledby="title desc">
  <title id="title">How two trained detectors read one 9.50 centimetre peak</title>
  <desc id="desc">The same smoothed peak height is marked on two centimetre rulers from a saved weedy tomato scan. The ordinary model learned a mean of 13.97 cm and a standard deviation of 10.16 cm. This peak is 0.44 standard deviations below that mean. The half-difficult model learned a mean of 16.91 cm and a standard deviation of 9.71 cm. The peak is 0.76 standard deviations below its mean.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #233e30 }
    .heading { font-size: 21px; font-weight: 720 }
    .label { font-size: 16px; font-weight: 680 }
    .detail { font-size: 14px }
    .score { font-size: 21px; font-weight: 710; fill: #57436d }
    .rail { fill: none; stroke: #798d78; stroke-width: 1.4 }
    .gap { fill: none; stroke: #72518b; stroke-width: 2.6 }
    .mean { fill: none; stroke: #234f44; stroke-width: 2.1 }
    @media (prefers-reduced-motion: no-preference) {
      .gap { animation: measure 2.2s ease-out 1 }
      .second { animation-delay: .35s; animation-fill-mode: backwards }
      @keyframes measure { 0%,18% { stroke-dasharray: 0 1 } 78%,100% { stroke-dasharray: 1 0 } }
    }
  </style>
  <defs>
    <g id="ruler">
      <path class="rail" d="M28 0h285m-285-4v8m95-8v8m95-8v8m95-8v8"/>
      <path d="m118.2-8 4.5 4.5-4.5 4.5-4.5-4.5Z" fill="#925031" stroke="#fff6e8"/>
    </g>
  </defs>
  <rect width="414" height="286" rx="15" fill="#f7f8ef"/>
  <text x="17" y="30" class="heading">One peak, two training scales</text>
  <text x="17" y="54" class="detail">The same scan gives a smoothed peak height of 9.50 cm.</text>
  <path d="M17 68H397M17 151H397M17 233H397" stroke="#d4ddcf"/>

  <text x="18" y="91" class="label">Ordinary backgrounds</text>
  <rect x="64.2" y="105" width="193.1" height="15" rx="6" fill="#dae6d6"/>
  <use href="#ruler" y="113"/>
  <path class="gap" d="M160.8 113H118.2" pathLength="1"/>
  <path class="mean" d="M160.8 104v17"/>
  <text x="18" y="139" class="detail">Mean 13.97 cm · spread 10.16 cm</text>
  <text x="334" y="118" class="score">−0.44</text>

  <text x="18" y="174" class="label">Half difficult backgrounds</text>
  <rect x="96.3" y="188" width="184.6" height="15" rx="6" fill="#dae6d6"/>
  <use href="#ruler" y="196"/>
  <path class="gap second" d="M188.6 196H118.2" pathLength="1"/>
  <path class="mean" d="M188.6 187v17"/>
  <text x="18" y="222" class="detail">Mean 16.91 cm · spread 9.71 cm</text>
  <text x="334" y="201" class="score">−0.76</text>

  <path d="m21 244 4.5 4.5-4.5 4.5-4.5-4.5Z" fill="#925031"/>
  <text x="31" y="254" class="detail">Peak</text>
  <path class="mean" d="M87 243v11"/>
  <text x="96" y="254" class="detail">Training mean</text>
  <rect x="205" y="242" width="18" height="13" rx="4" fill="#dae6d6"/>
  <text x="231" y="254" class="detail">One spread either side</text>
  <text x="17" y="277" class="detail">The inputs show how many spreads below the mean it lies.</text>
</svg>
