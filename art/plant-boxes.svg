<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" aria-labelledby="title desc">
  <title id="title">When two plant boxes share the same ground</title>
  <desc id="desc">An overhead sketch shows a tomato and a weed. Their rectangular annotations overlap at a corner where there is bare soil. The rectangles alone cannot say whether leaves touch.</desc>
  <defs>
    <radialGradient id="earth"><stop stop-color="#805e42"/><stop offset="1" stop-color="#443a31"/></radialGradient>
    <pattern id="soil" width="33" height="23" patternUnits="userSpaceOnUse"><path d="m4 5 4-1m13 12 3 1" stroke="#d1ad77" stroke-opacity=".48" stroke-width="1.5" stroke-linecap="round"/></pattern>
    <g id="sprig" fill="#a9c56c" stroke="#6e9659" stroke-width="1.3" stroke-linejoin="round"><path d="M0 0Q-21-26-25-52L-22-46-24-58Q-14-54-13-44L-13-52Q-6-43-7-35L-4-40Q1-24 0 0Z"/><path d="M-1-7q-10-20-19-42" fill="none" stroke="#e2e6a7"/></g>
    <g id="grass"><path d="M0 0Q-35-18-49-52Q-19-39 0 0" fill="#7da975"/><path d="M0 0Q-26-31-43-45" fill="none" stroke="#c6d9a2" stroke-width="1.5"/></g>
    <pattern id="shared" width="8" height="8" patternUnits="userSpaceOnUse"><path d="m-2 2 4-4M0 8l8-8m-2 10 4-4" stroke="#ffe6a5" stroke-width="2"/></pattern>
  </defs>
  <style>
    text{font:600 19px system-ui,sans-serif;fill:#fff5d7}.legend{font-size:16px}
    @media(prefers-reduced-motion:no-preference){.box{animation:draw 7s ease-in-out infinite}.second{animation-delay:.45s}.area{animation:shade 7s ease-in-out infinite}@keyframes draw{0%{stroke-dasharray:1 99}45%,100%{stroke-dasharray:100 0}}@keyframes shade{0%,43%{opacity:.25}62%,90%{opacity:1}100%{opacity:.25}}}
  </style>
  <rect width="640" height="244" rx="18" fill="url(#earth)"/><rect width="640" height="244" rx="18" fill="url(#soil)"/>
  <g transform="translate(233 96) scale(.9)"><use href="#sprig" transform="rotate(-50)"/><use href="#sprig" transform="rotate(-115) scale(1.05)"/><use href="#sprig" transform="rotate(53) scale(1.16)"/><use href="#sprig" transform="rotate(131) scale(.86)"/><use href="#sprig" transform="rotate(202) scale(.74)"/><circle r="4" fill="#d9df83"/></g>
  <g transform="translate(349 141) scale(.94)"><use href="#grass"/><use href="#grass" transform="rotate(64)"/><use href="#grass" transform="rotate(118) scale(.95)"/><use href="#grass" transform="rotate(199) scale(.95)"/><use href="#grass" transform="rotate(268) scale(.93)"/><circle r="3" fill="#dbd79a"/></g>
  <rect class="box" pathLength="100" x="170" y="39" width="121" height="111" rx="1" fill="none" stroke="#ffcc7e" stroke-width="3"/>
  <rect class="box second" pathLength="100" x="285" y="73" width="129" height="134" rx="1" fill="none" stroke="#a8e6df" stroke-width="3" stroke-dasharray="8 3"/>
  <rect class="area" x="285" y="73" width="6" height="77" fill="url(#shared)"/>
  <text x="76" y="73">Tomato</text><path d="M79 83h68l24-19" stroke="#ffcc7e" fill="none" stroke-width="2"/>
  <text x="461" y="163">Weed</text><path d="M461 173h-24l-22 15" stroke="#a8e6df" fill="none" stroke-width="2"/>
  <text x="41" y="201" class="legend">Shared strip</text><path d="M133 194Q235 185 286 125" stroke="#fff2c6" stroke-width="2" fill="none"/><circle cx="287" cy="125" r="3" fill="#fff2c6"/>
</svg>
