<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" role="img" aria-labelledby="title desc">
  <title id="title">Where did the depth camera lose a leaf?</title>
  <desc id="desc">A romaine leaf is visible in color. In a schematic depth map of the same leaf, a hatched patch marks neighboring pixels where the camera returned no distance.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff9df"/><stop offset="1" stop-color="#f4dfae"/></linearGradient>
    <linearGradient id="blade" x2=".8" y2="1"><stop stop-color="#2b684b"/><stop offset=".5" stop-color="#7da654"/><stop offset="1" stop-color="#c5d678"/></linearGradient>
    <pattern id="cells" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9V0H9" stroke="#e6f1c4" stroke-width=".9" fill="none"/></pattern>
    <pattern id="holes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#493b4b"/><path d="m-2 2 4-4m-2 8 6-6m-2 8 4-4" stroke="#dbbad1" stroke-width="1.3"/></pattern>
    <path id="leaf" d="M132 165C114 159 95 167 86 151Q66 150 70 132C47 121 59 105 55 96Q42 79 58 66Q51 42 71 39C74 17 92 24 100 21C109 9 127 19 127 31Q145 27 148 44Q167 43 163 64Q179 76 166 91Q178 111 159 123Q163 142 145 150Z"/>
    <clipPath id="cut"><use href="#leaf"/></clipPath>
    <g id="veins" fill="none" stroke="#dbe5a1" stroke-linecap="round"><path d="M135 177Q116 122 100 39" stroke-width="5"/><path d="M124 145Q99 136 78 111m43 19q18-17 33-43m-40 22Q89 99 67 74m43 13q16-15 29-42m-35 21L83 40" stroke-width="2.5"/></g>
  </defs>
  <style>
    text{font:600 20px system-ui,sans-serif;fill:#284736}.small{font:16px system-ui,sans-serif}
    @media(prefers-reduced-motion:no-preference){.line{animation:sample 6s ease-in-out infinite}.border{animation:find 6s ease-in-out infinite}@keyframes sample{0%,12%{transform:translateX(0);opacity:0}22%{opacity:1}65%{transform:translateX(136px);opacity:1}74%,100%{transform:translateX(136px);opacity:0}}@keyframes find{0%,42%,100%{stroke-width:1.8}60%,82%{stroke-width:3.5}}}
  </style>
  <rect width="640" height="254" rx="18" fill="url(#paper)"/>
  <g transform="translate(50 6)"><use href="#leaf" fill="url(#blade)" stroke="#40714b" stroke-width="2"/><use href="#veins"/></g>
  <path d="M278 105H335m-11-10 12 10-12 10" fill="none" stroke="#787d5a" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(344 6)"><use href="#leaf" fill="#62988b"/><g clip-path="url(#cut)"><use href="#veins" opacity=".68"/><path fill="url(#cells)" d="M42 7h140v165H42z"/><path class="border" fill="url(#holes)" stroke="#47374c" stroke-width="1.8" d="M72 63h27v9h9v18H90v9H72V81h-9v-9h9z"/><path class="line" d="M45 15v150" stroke="#ffdf75" stroke-width="3"/></g></g>
  <g text-anchor="middle"><text x="160" y="210">Color photograph</text><text x="454" y="210">Depth map</text><text x="454" y="235" class="small">Hatching = missing distance</text></g>
</svg>
