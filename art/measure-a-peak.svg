  <g transform="translate(302 83) scale(1)">
    <path d="M-43 10l79 -29 6 17 -79 29Z" fill="#f6cd76" stroke="#355f54" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M-34 7l3 8" fill="none" stroke="#88663c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
