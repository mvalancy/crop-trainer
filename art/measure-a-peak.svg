    <circle cx="-5" cy="-7" r="2.6" fill="#477f75" />
    <circle cx="0" cy="-17" r="2.6" fill="#477f75" />
    <circle cx="3" cy="-4" r="2.6" fill="#477f75" />
    <circle cx="7" cy="-11" r="2.6" fill="#477f75" />
    <circle cx="9" cy="6" r="2.6" fill="#477f75" />
    <circle cx="14" cy="10" r="2.6" fill="#477f75" />
