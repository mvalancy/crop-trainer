<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-labelledby="title detail">
<title id="title">Hear the distance, keep the measurement</title><desc id="detail">A measuring line runs from a lettuce center to a prediction fourteen centimeters away. The voice pulse and written distance describe the same two points.</desc>
<defs><radialGradient id="leaf"><stop stop-color="#c2da80"/><stop offset=".65" stop-color="#7eae66"/><stop offset="1" stop-color="#427950"/></radialGradient><g id="plant" fill="url(#leaf)" stroke="#235e49" stroke-width="2"><path id="l" d="M0 3C-12 0-37-16-32-32c11-7 34 10 32 35Z"/><use href="#l" transform="rotate(60)"/><use href="#l" transform="rotate(120)"/><use href="#l" transform="rotate(180)"/><use href="#l" transform="rotate(240)"/><use href="#l" transform="rotate(300)"/><circle r="6" fill="#d7e599"/></g></defs>
<style>.measure{stroke-dasharray:150;animation:measure 6s ease-out infinite}.voice{transform-box:fill-box;transform-origin:center;animation:voice 1.9s ease-in-out infinite}.second{animation-delay:.23s}.third{animation-delay:.45s}@keyframes measure{0%,8%{stroke-dashoffset:150}50%,100%{stroke-dashoffset:0}}@keyframes voice{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="720" height="196" rx="20" fill="#173b31"/><path d="M26 150q100-18 206-1t204-1v23H26Z" fill="#365746"/><use href="#plant" transform="translate(122 94)"/><g fill="none" stroke="#f4db95"><circle cx="122" cy="94" r="13"/><path d="M122 75v38m-19-19h38"/></g><path class="measure" d="M122 94h146" fill="none" stroke="#ffe8a3" stroke-width="3"/><path d="m267 82 11 12-11 12-11-12z" fill="#d49c69" stroke="#ffe4af" stroke-width="2"/><text x="192" y="68" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff1bd">14 cm</text>
<g stroke="#739a81" stroke-width="2"><path d="M342 36v123"/></g><g fill="none" stroke="#b8dda8" stroke-width="6" stroke-linecap="round"><path d="M391 90h10l17-14v36l-17-13h-10z"/><path class="voice" d="M433 84q8 10 0 20"/><path class="voice second" d="M445 74q16 20 0 40"/><path class="voice third" d="M457 65q23 29 0 58"/></g><g font-family="sans-serif" font-size="21" fill="#fff3d7"><text x="501" y="84">14 cm</text><text x="501" y="120">١٤ سم</text></g>
</svg>
