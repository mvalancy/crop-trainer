<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 195" role="img" aria-labelledby="title desc">
  <title id="title">The canopy and the planting base</title>
  <desc id="desc">A leaning vine can put its highest visible leaves to one side of its surveyed trunk. This is an illustrative mechanism.</desc>
  <style>
    text {font-family:system-ui,sans-serif}
    @media (prefers-reduced-motion: no-preference) {
      .trace {stroke-dasharray:4 8; animation: travel 3s linear infinite} @keyframes travel {to {stroke-dashoffset:-36}}
    }
  </style>
  <rect width="500" height="195" rx="14" fill="#fff8e2"/>
  <text x="250" y="30" text-anchor="middle" fill="#173e32" font-size="21" font-weight="700">Where is the vine planted?</text>
  <path d="M43 149Q249 145 454 149" fill="none" stroke="#b27031" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M183 149Q182 109 229 83Q251 72 273 66" fill="none" stroke="#b27031" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M161 98Q152 72 183 68Q190 45 216 59Q233 35 254 54Q278 30 299 55Q328 51 330 73Q345 95 310 99Q286 115 262 97Q229 108 218 96Q178 111 161 98Z" fill="#dce8bf" stroke="#507e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="277" y1="56" x2="277" y2="148" stroke="#a54434" stroke-width="2" class="trace"/>
  <path d="M277 47l7 7-7 7-7-7Z" fill="#a54434" stroke="#fff8e2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="183" cy="148" r="6" fill="#fff8e2" stroke="#173e32" stroke-width="2" />
  <text x="154" y="178" text-anchor="middle" fill="#173e32" font-size="17" font-weight="700">Trunk base</text>
  <text x="338" y="178" text-anchor="middle" fill="#173e32" font-size="15" font-weight="500">Peak projected to ground</text>
  <line x1="183" y1="151" x2="183" y2="158" stroke="#173e32" stroke-width="2" />
  <line x1="277" y1="149" x2="277" y2="156" stroke="#a54434" stroke-width="2" />
</svg>
