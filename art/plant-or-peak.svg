    <g transform="translate(5 17) scale(0.65)">
      <use href="#blade" />
    </g>
    <g class="notice">
      <path d="M-36 -24v41" fill="none" stroke="#cc8051" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="-36" cy="17" r="3" fill="#ad523c" />
      <path d="M-19 -24v28" fill="none" stroke="#cc8051" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="-19" cy="4" r="3" fill="#ad523c" />
