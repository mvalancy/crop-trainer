    <circle cx="-31" cy="15" r="2.6" fill="#477f75" />
    <circle cx="-23" cy="19" r="2.6" fill="#477f75" />
    <circle cx="-15" cy="8" r="2.6" fill="#477f75" />
    <circle cx="-13" cy="-3" r="2.6" fill="#477f75" />
    <circle cx="-9" cy="-13" r="2.6" fill="#477f75" />
    <circle cx="-5" cy="-7" r="2.6" fill="#477f75" />
    <circle cx="0" cy="-17" r="2.6" fill="#477f75" />
    <circle cx="3" cy="-4" r="2.6" fill="#477f75" />
    <circle cx="7" cy="-11" r="2.6" fill="#477f75" />
    <circle cx="9" cy="6" r="2.6" fill="#477f75" />
    <circle cx="14" cy="10" r="2.6" fill="#477f75" />
    <circle cx="22" cy="18" r="2.6" fill="#477f75" />
    <circle cx="31" cy="17" r="2.6" fill="#477f75" />
    <circle cx="40" cy="19" r="2.6" fill="#477f75" />
    <g class="notice">
