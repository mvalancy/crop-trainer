      <circle cx="-6" cy="-6" r="3" fill="#ad523c" />
      <path d="M7 -24v26" fill="none" stroke="#cc8051" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="7" cy="2" r="3" fill="#ad523c" />
      <path d="M24 -24v42" fill="none" stroke="#cc8051" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="24" cy="18" r="3" fill="#ad523c" />
      <path d="M39 -24v42" fill="none" stroke="#cc8051" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="39" cy="18" r="3" fill="#ad523c" />
    </g>
  </g>
  <text x="302" y="137" text-anchor="middle">Several returns</text>
