<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" role="img" aria-labelledby="title desc">
  <title id="title">One tomato return and the pin for Box 77</title>
  <desc id="desc">Two top views show the same patch of a synthetic ring scan. A dashed circle covers 15 centimeters around the planted center. With the single tomato return present, a pin landed 11.2 centimeters from the center. Removing only that return erased the local peak before the model could score it. The soil returns occupy the same positions in both panels.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #263c32 }
    .title { font-size: 21px; font-weight: 720 }
    .heading { font-size: 16px; font-weight: 680 }
    .detail { font-size: 14px }
    .soil { fill: none; stroke: #857358; stroke-width: 2.3; stroke-linecap: round }
    .pin { fill: none; stroke: #70458d; stroke-width: 2.3 }
    .pulse { opacity: 0 }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: locate 3s ease-out 1 }
      .before .pin { animation: mark 3s ease-out 1 }
      @keyframes locate {
        0%,8% { opacity: 0; transform: scale(.35) }
        22% { opacity: .85 }
        56%,100% { opacity: 0; transform: scale(1.35) }
      }
      @keyframes mark { 0%,32% { opacity: .4 } 63%,100% { opacity: 1 } }
    }
  </style>
  <defs>
    <!-- Soil XY positions within 20.3 cm of the center along both axes, at 260 display units per metre. -->
    <g id="patch">
      <rect x="-54" y="-54" width="108" height="108" rx="4" fill="#eeeada" stroke="#d6d4bf"/>
      <path class="soil" d="
        M-36 48.9v.1 M-36.9 42.7v.1 M-37.9 36.5v.1 M-39.9 24.1v.1 M-40.9 17.9v.1 M-41.9 11.7v.1 M-43 5.4v.1 M-44 -.8v.1 M-45.1 -7.1v.1 M-46.2 -13.4v.1 M-47.3 -19.6v.1 M-48.5 -25.9v.1 M-49.6 -32.3v.1 M-50.8 -38.6v.1
        M-14.8 51.2v.1 M-15.8 44.9v.1 M-16.7 38.6v.1 M-17.7 32.3v.1 M-18.7 26v.1 M-19.7 19.6v.1 M-20.7 13.3v.1 M-21.8 6.9v.1 M-22.8 .6v.1 M-23.9 -5.8v.1 M-26.1 -18.6v.1 M-27.2 -25v.1 M-28.4 -31.4v.1 M-29.6 -37.9v.1 M-30.8 -44.3v.1 M-32 -50.8v.1
        M5.4 47.5v.1 M4.5 41v.1 M3.5 34.6v.1 M2.5 28.2v.1 M1.5 21.7v.1 M-.5 8.8v.1 M-1.6 2.3v.1 M-2.7 -4.2v.1 M-3.8 -10.7v.1 M-4.9 -17.2v.1 M-6 -23.7v.1 M-7.1 -30.3v.1 M-8.3 -36.8v.1 M-9.5 -43.4v.1 M-10.7 -50v.1
        M25.7 43.9v.1 M24.7 37.3v.1 M23.8 30.8v.1 M22.8 24.2v.1 M21.8 17.6v.1 M20.7 11v.1 M19.7 4.4v.1 M18.6 -2.2v.1 M17.5 -8.8v.1 M15.3 -22.1v.1 M13 -35.4v.1 M11.8 -42v.1 M10.6 -48.7v.1
        M46.9 47v.1 M46 40.4v.1 M45 33.7v.1 M44 27v.1 M43 20.3v.1 M42 13.6v.1 M41 6.9v.1 M38.8 -6.5v.1 M37.7 -13.3v.1 M36.6 -20v.1 M35.5 -26.8v.1 M34.3 -33.6v.1 M33.1 -40.4v.1 M32 -47.2v.1 M52.1 -52.1v.1"/>
      <circle r="39" stroke="#5e725e" fill="none" stroke-dasharray="3 4"/>
      <path d="M-5 0H5M0-5V5" stroke="#253d32" stroke-width="2"/>
    </g>
    <path id="diamond" d="m0-4.8 4.8 4.8L0 4.8-4.8 0Z"/>
  </defs>
  <rect width="400" height="290" rx="14" fill="#f7f8ef"/>
  <text x="18" y="31" class="title">One return from Box 77</text>
  <text x="18" y="54" class="detail">Top view · dashed circle = 15 cm from the plant center</text>
  <g text-anchor="middle">
    <text x="103" y="81" class="heading">Original scan</text>
    <text x="297" y="81" class="heading">One return removed</text>
  </g>
  <g class="before" transform="translate(103 146)">
    <use href="#patch"/>
    <g transform="translate(16.4 -15.4)">
      <circle r="3.4" fill="#087451"/>
      <circle class="pulse" r="8" fill="none" stroke="#087451" stroke-width="1.6"/>
    </g>
    <use href="#diamond" class="pin" x="19.8" y="-21.4"/>
  </g>
  <use href="#patch" x="297" y="146"/>
  <g text-anchor="middle">
    <text x="103" y="224" class="heading">Peak scored 0.65105</text>
    <text x="297" y="224" class="heading">Peak disappears</text>
    <text x="103" y="244" class="detail">Pin at 11.2 cm</text>
    <text x="297" y="244" class="detail">Plant missed</text>
  </g>
  <path d="M18 256H382" stroke="#d3dccd"/>
  <path d="M25 274h8m-4-4v8" stroke="#253d32" stroke-width="2"/>
  <text x="40" y="279" class="detail">Plant center</text>
  <circle cx="149" cy="274" r="3.4" fill="#087451"/>
  <text x="159" y="279" class="detail">Tomato</text>
  <circle cx="233" cy="274" r="2" fill="#857358"/>
  <text x="243" y="279" class="detail">Soil</text>
  <use href="#diamond" class="pin" x="305" y="274"/>
  <text x="316" y="279" class="detail">Pin</text>
</svg>
